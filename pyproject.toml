[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobparser"
version = "0.1.0"
description = "Read IMAP email and score likely job adverts against CV terms."
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobparser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
